name: traceable-portfoliobatch
channels:
  - conda-forge
dependencies:
  - python=3.13.5
  - numpy=2.3.5
  - pandas=2.2.3
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - scipy=1.17.0
  - joblib=1.5.3
  - pillow=12.2.0
  - pytest=8.4.2
variables:
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PAPER13_NUMPY_CPU_DISPATCH_POLICY: dynamically_disable_recognized_avx512_targets
